name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Docker daemon is available by default on ubuntu-latest, 
      # which Testcontainers will use to spin up Postgres and Redis.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Maven Tests
      working-directory: ./api
      # This will automatically download Testcontainers images (pgvector, redis)
      # and run the integration tests.
      run: mvn clean test

    - name: Verify Docker Compose Build
      # Ensures that all Dockerfiles (API and ML Sidecar) compile successfully
      run: docker-compose build
