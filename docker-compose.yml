services:
  # --- PostgreSQL with pgvector extension for vector similarity search ---
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: ragforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Redis 7 for queue (Streams), cache, and rate limiting ---
  redis:
    image: redis:7-alpine
    container_name: ragforge-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Spring Boot API ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ragforge-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      UPLOAD_DIR: /data/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3}
      ZIPKIN_URL: http://zipkin:9411
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

  # --- Zipkin for Distributed Tracing ---
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ragforge-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Prometheus Metrics Scraper ---
  prometheus:
    image: prom/prometheus:latest
    container_name: ragforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # --- Grafana Dashboard UI ---
  grafana:
    image: grafana/grafana:latest
    container_name: ragforge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # --- Python ML sidecar for embeddings and reranking ---
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ragforge-ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 10
      # Models take time to download on first run
      start_period: 120s

  # --- Web Frontend UI ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragforge-frontend
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  grafanadata:
